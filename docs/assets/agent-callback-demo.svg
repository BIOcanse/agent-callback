<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Agent Callback product walkthrough</title>
  <desc id="description">Three steps show an agent registering a callback, a local process running while the user works elsewhere, and the same conversation resuming once after completion.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1830"/>
      <stop offset="1" stop-color="#101c36"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#63e6be"/>
      <stop offset="1" stop-color="#65a7ff"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#142440"/>
      <stop offset="1" stop-color="#0d1a31"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020812" flood-opacity="0.55"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#8aa4cf" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#63e6be"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <circle cx="1450" cy="72" r="250" fill="#65a7ff" opacity="0.06"/>
  <circle cx="160" cy="790" r="280" fill="#63e6be" opacity="0.045"/>

  <g transform="translate(72 58)">
    <rect width="58" height="58" rx="17" fill="url(#brand)"/>
    <path d="M19 31a11 11 0 0 1 19-7M39 20v8h-8M39 31a11 11 0 0 1-19 7M19 42v-8h8" fill="none" stroke="#07111f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="78" y="22" fill="#8ca5cc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="700" letter-spacing="2.4">AGENT CALLBACK</text>
    <text x="78" y="54" fill="#f4f8ff" font-family="Segoe UI, Inter, sans-serif" font-size="27" font-weight="700">Stop babysitting long-running local work.</text>
  </g>
  <text x="1528" y="83" text-anchor="end" fill="#93a9ca" font-family="Segoe UI, Inter, sans-serif" font-size="20">Register once · Keep working · Resume here</text>

  <text x="800" y="172" text-anchor="middle" fill="#eaf2ff" font-family="Segoe UI, Inter, sans-serif" font-size="38" font-weight="750">A durable one-shot callback to the same agent conversation</text>
  <text x="800" y="207" text-anchor="middle" fill="#8fa7ca" font-family="Segoe UI, Inter, sans-serif" font-size="20">No polling loop. No copied conversation ID. No arbitrary message endpoint.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="254" width="440" height="430" rx="28" fill="url(#card)" stroke="#2a4063"/>
    <rect x="580" y="254" width="440" height="430" rx="28" fill="url(#card)" stroke="#2a4063"/>
    <rect x="1090" y="254" width="440" height="430" rx="28" fill="url(#card)" stroke="#2a4063"/>
  </g>

  <g font-family="Segoe UI, Inter, sans-serif">
    <circle cx="111" cy="298" r="20" fill="#65a7ff"/>
    <text x="111" y="305" text-anchor="middle" fill="#07111f" font-size="19" font-weight="800">1</text>
    <text x="145" y="305" fill="#f3f7ff" font-size="24" font-weight="700">Ask naturally</text>
    <text x="111" y="338" fill="#8fa7ca" font-size="16">The Skill registers before you leave.</text>

    <rect x="101" y="370" width="342" height="103" rx="18" fill="#1c3153"/>
    <text x="122" y="397" fill="#7fb5ff" font-size="13" font-weight="800" letter-spacing="1.4">YOU</text>
    <text x="122" y="427" fill="#ecf4ff" font-size="18">“Run the full test suite.</text>
    <text x="122" y="453" fill="#ecf4ff" font-size="18">Call back here when it finishes.”</text>

    <rect x="137" y="492" width="342" height="112" rx="18" fill="#123a40" stroke="#2b756d"/>
    <text x="158" y="520" fill="#63e6be" font-size="13" font-weight="800" letter-spacing="1.4">AGENT</text>
    <text x="158" y="550" fill="#eafff9" font-size="18">“Callback registered.</text>
    <text x="158" y="576" fill="#eafff9" font-size="18">You can keep working.”</text>
    <rect x="101" y="626" width="157" height="31" rx="15.5" fill="#182c49"/>
    <circle cx="120" cy="641.5" r="5" fill="#63e6be" filter="url(#glow)"/>
    <text x="135" y="647" fill="#a9bddd" font-size="14" font-weight="650">REGISTERED</text>

    <circle cx="621" cy="298" r="20" fill="#9c8cff"/>
    <text x="621" y="305" text-anchor="middle" fill="#07111f" font-size="19" font-weight="800">2</text>
    <text x="655" y="305" fill="#f3f7ff" font-size="24" font-weight="700">Local work runs</text>
    <text x="621" y="338" fill="#8fa7ca" font-size="16">The Host owns the durable wait.</text>

    <rect x="611" y="370" width="378" height="202" rx="18" fill="#07111f" stroke="#263a5d"/>
    <circle cx="636" cy="393" r="5" fill="#ff6b7d"/>
    <circle cx="654" cy="393" r="5" fill="#ffd166"/>
    <circle cx="672" cy="393" r="5" fill="#63e6be"/>
    <line x1="611" y1="421" x2="989" y2="421" stroke="#334867"/>
    <text x="636" y="463" fill="#7fb5ff" font-family="Cascadia Mono, Consolas, monospace" font-size="17">&gt; dotnet test</text>
    <text x="636" y="497" fill="#c7d5ea" font-family="Cascadia Mono, Consolas, monospace" font-size="16">Running 18 tests…</text>
    <rect x="636" y="521" width="240" height="9" rx="4.5" fill="#1d3150"/>
    <rect x="636" y="521" width="154" height="9" rx="4.5" fill="url(#brand)"/>
    <text x="636" y="552" fill="#758dad" font-size="13">PID + creation time pinned</text>

    <rect x="611" y="595" width="378" height="62" rx="17" fill="#191f43" stroke="#4b467f"/>
    <path d="M641 627a11 11 0 1 1 11 11" fill="none" stroke="#9c8cff" stroke-width="3" stroke-linecap="round"/>
    <path d="M652 632v7h-7" fill="none" stroke="#9c8cff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="671" y="622" fill="#c9c0ff" font-size="13" font-weight="800" letter-spacing="1">HOST WATCHING</text>
    <text x="671" y="644" fill="#9daed0" font-size="14">You are free to do something else.</text>

    <circle cx="1131" cy="298" r="20" fill="#63e6be"/>
    <text x="1131" y="305" text-anchor="middle" fill="#07111f" font-size="19" font-weight="800">3</text>
    <text x="1165" y="305" fill="#f3f7ff" font-size="24" font-weight="700">Same conversation resumes</text>
    <text x="1131" y="338" fill="#8fa7ca" font-size="16">One delivery, then independent verification.</text>

    <rect x="1121" y="370" width="378" height="58" rx="17" fill="#123a40" stroke="#2b756d"/>
    <circle cx="1150" cy="399" r="8" fill="#63e6be"/>
    <path d="M1146 399l3 3 6-7" fill="none" stroke="#07111f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1172" y="395" fill="#63e6be" font-size="13" font-weight="800" letter-spacing="1">DELIVERED ONCE</text>
    <text x="1172" y="414" fill="#b6c9e5" font-size="13">Process exit or authenticated event</text>

    <rect x="1152" y="454" width="347" height="145" rx="18" fill="#1c3153"/>
    <text x="1173" y="482" fill="#7fb5ff" font-size="13" font-weight="800" letter-spacing="1.4">AGENT</text>
    <text x="1173" y="512" fill="#ecf4ff" font-size="17">“The process exited.</text>
    <text x="1173" y="539" fill="#ecf4ff" font-size="17">I checked the report:</text>
    <text x="1173" y="566" fill="#eafff9" font-size="17" font-weight="700">all 18 tests passed.”</text>

    <rect x="1121" y="624" width="163" height="33" rx="16.5" fill="#123a40"/>
    <path d="M1142 641l5 5 10-12" fill="none" stroke="#63e6be" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1167" y="647" fill="#b9eadf" font-size="14" font-weight="700">ACKNOWLEDGED</text>
  </g>

  <path d="M525 470H560" fill="none" stroke="#63e6be" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M1035 470H1070" fill="none" stroke="#63e6be" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g font-family="Segoe UI, Inter, sans-serif">
    <rect x="70" y="730" width="1460" height="104" rx="24" fill="#0b1629" stroke="#243957"/>
    <text x="115" y="767" fill="#839abb" font-size="13" font-weight="800" letter-spacing="1.8">TRIGGERS</text>
    <text x="115" y="803" fill="#e5efff" font-size="18" font-weight="650">PROCESS EXIT</text>
    <circle cx="285" cy="797" r="3" fill="#4f6689"/>
    <text x="303" y="803" fill="#e5efff" font-size="18" font-weight="650">AUTHENTICATED EVENT</text>

    <line x1="555" y1="753" x2="555" y2="812" stroke="#243957"/>
    <text x="600" y="767" fill="#839abb" font-size="13" font-weight="800" letter-spacing="1.8">PROVIDERS</text>
    <text x="600" y="803" fill="#e5efff" font-size="18" font-weight="650">CODEX DESKTOP</text>
    <circle cx="788" cy="797" r="3" fill="#4f6689"/>
    <text x="806" y="803" fill="#e5efff" font-size="18" font-weight="650">OPENCODE</text>

    <line x1="994" y1="753" x2="994" y2="812" stroke="#243957"/>
    <text x="1039" y="767" fill="#839abb" font-size="13" font-weight="800" letter-spacing="1.8">DESIGN</text>
    <text x="1039" y="803" fill="#63e6be" font-size="18" font-weight="700">LOCAL</text>
    <circle cx="1112" cy="797" r="3" fill="#4f6689"/>
    <text x="1130" y="803" fill="#63e6be" font-size="18" font-weight="700">DURABLE</text>
    <circle cx="1229" cy="797" r="3" fill="#4f6689"/>
    <text x="1247" y="803" fill="#63e6be" font-size="18" font-weight="700">PROVIDER-NEUTRAL</text>
  </g>
</svg>
